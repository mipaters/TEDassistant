<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="orb" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#3fa9ff"/>
      <stop offset="55%" stop-color="#7a6dfb"/>
      <stop offset="100%" stop-color="#ff2d6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fa9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fa9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="35%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- outer signal ring (TED "listening"/presence halo) -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5"/>

  <!-- core assistant orb -->
  <circle cx="256" cy="256" r="118" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="118" fill="url(#sheen)"/>

  <!-- minimal voice-wave glyph at center -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <line x1="210" y1="232" x2="210" y2="280"/>
    <line x1="256" y1="204" x2="256" y2="308"/>
    <line x1="302" y1="232" x2="302" y2="280"/>
  </g>
</svg>
