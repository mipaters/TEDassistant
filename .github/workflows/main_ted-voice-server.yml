# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# This repo is a monorepo: the Next.js app lives at the repo root (deployed to
# Azure Static Web Apps separately) and the Twilio/Azure voice bridge lives in
# voice-server/ (deployed here, to the ted-voice-server App Service). All
# steps below operate only on the voice-server/ subfolder.

name: Build and deploy Node.js app to Azure Web App - ted-voice-server

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        working-directory: voice-server
        run: |
          npm ci
          npm run build --if-present

      - name: Remove devDependencies before deploy
        working-directory: voice-server
        run: npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: voice-server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EB522930A3E4911AADD1FC28D719B49 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DAA6B35E2356460BA46DC243CB45121C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_531800A722E1419D82E2DE5E426155E9 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ted-voice-server'
          slot-name: 'Production'
          package: .
